<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Анастасия — портфолио</title>
<meta name="description" content="Портфолио Анастасии: дизайн коммуникаций, SMM-стратегии и управление проектами.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23A9CBEA'/%3E%3Crect x='4' y='4' width='8' height='8' fill='%23F6C9D3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
:root {
  --desk: #E8DFCC; --face: #F4EEDF; --paper: #FFFDF7; --ink: #2B2620; --muted: #5E5647; --line: #A89E8A;
  --pri: #A9CBEA; --sec: #F6C9D3; --bar-text: #1F2A36;
  --bevel: inset -2px -2px 0 #5E5647, inset 2px 2px 0 #FFFDF7, inset -4px -4px 0 #A89E8A, inset 4px 4px 0 #F4EEDF;
  --sunk: inset 2px 2px 0 #5E5647, inset -2px -2px 0 #FFFDF7, inset 4px 4px 0 #A89E8A, inset -4px -4px 0 #F4EEDF;
  --px: 'Pixelify Sans', 'Courier New', monospace;
  --mono: 'IBM Plex Mono', 'Courier New', monospace;
  --menubar: 40px; --taskbar: 52px;
}
:root[data-theme="pink"] { --pri: #F2B8C6; --sec: #BFD9F0; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--mono); color: var(--ink); background-color: var(--desk);
  background-image: radial-gradient(#D8CDB5 1px, transparent 1px); background-size: 4px 4px;
  overflow: hidden; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px dotted var(--ink); outline-offset: -6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shell ---------- */
.shell { position: fixed; inset: 0; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.menubar {
  height: var(--menubar); flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 0 16px; background: var(--face); border-bottom: 2px solid var(--ink); font-size: 14px;
}
.menubar nav { display: flex; align-items: center; gap: 4px; }
.logo { font-family: var(--px); font-weight: 700; font-size: 18px; padding: 2px 10px; background: var(--pri); margin-right: 12px; }
.menubar button { background: none; border: 0; padding: 0 10px; min-height: 36px; cursor: pointer; }
.menubar button:hover { background: var(--pri); }
.menubar .os { color: var(--muted); white-space: nowrap; }

.desktop { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.icons { position: absolute; top: 24px; left: 16px; display: flex; flex-direction: column; gap: 12px; }
.icon {
  width: 112px; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 4px;
  background: none; border: 0; cursor: pointer; font-size: 14px; text-align: center;
}
.icon span { background: var(--face); padding: 1px 6px; }
.icon:hover span, .icon:focus-visible span { background: var(--pri); }
.icon svg { width: 48px; height: 48px; }

/* ---------- windows ---------- */
.win {
  position: absolute; display: flex; flex-direction: column; padding: 6px; background: var(--face); box-shadow: var(--bevel);
  max-width: calc(100% - 16px); max-height: calc(100% - 16px); min-width: 280px;
  animation: pop 140ms steps(3, end);
}
@keyframes pop { from { transform: scale(0.96); opacity: 0.4; } to { transform: none; opacity: 1; } }
.win[hidden] { display: none; }
.win.max { inset: 8px !important; width: auto !important; max-width: none; max-height: none; }
.titlebar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 5px 5px 5px 10px;
  background: var(--line); cursor: grab; user-select: none; touch-action: none; flex-shrink: 0;
}
.win.active .titlebar { background: var(--pri); }
.titlebar h2 { margin: 0; font-family: var(--px); font-weight: 400; font-size: 18px; color: var(--bar-text); display: flex; align-items: center; gap: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.titlebar h2::before { content: ""; width: 14px; height: 14px; flex-shrink: 0; background: var(--paper); box-shadow: inset -2px -2px 0 var(--muted); }
.controls { display: flex; gap: 4px; flex-shrink: 0; }
.controls button {
  width: 28px; height: 26px; padding: 0; border: 0; background: var(--face); box-shadow: var(--bevel);
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.controls button:active, .btn:active, .task:active, .start:active { box-shadow: var(--sunk); }
.controls svg { width: 14px; height: 14px; }
.menu-row { display: flex; gap: 20px; padding: 6px 10px; font-size: 14px; border-bottom: 2px solid var(--line); flex-shrink: 0; }
.menu-row span::first-letter { text-decoration: underline; }
.win-body { overflow: auto; min-height: 0; }

.btn {
  min-width: 150px; min-height: 44px; padding: 0 24px; border: 0; background: var(--face); box-shadow: var(--bevel);
  display: inline-flex; align-items: center; justify-content: center; font-family: var(--px); font-size: 18px; text-decoration: none; cursor: pointer;
}
.btn.primary { outline: 2px solid var(--ink); outline-offset: -2px; }
.btn-row { display: flex; gap: 16px; flex-wrap: wrap; }
.sunk { background: var(--paper); box-shadow: var(--sunk); }

/* welcome */
.welcome { padding: 32px 36px 32px; display: flex; flex-direction: column; gap: 22px; }
.prompt { font-size: 14px; color: var(--muted); }
.caret { display: inline-block; width: 10px; height: 18px; background: var(--ink); margin-left: 4px; vertical-align: -3px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.welcome h1 { margin: 0; font-family: var(--px); font-weight: 700; font-size: clamp(48px, 7vw, 88px); line-height: 0.95; }
.welcome p { margin: 0; font-size: 18px; line-height: 1.6; max-width: 62ch; }
.progress { height: 28px; padding: 4px; display: flex; gap: 3px; }
.progress i { width: 18px; background: var(--pri); }
.small { font-size: 13px; color: var(--muted); line-height: 1.5; }

/* skills */
.skills { padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.skills h3 { margin: 0; font-family: var(--px); font-weight: 400; font-size: 20px; }
.skills ul { list-style: none; margin: 0; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.skills li { display: flex; align-items: center; gap: 12px; min-height: 30px; font-size: 15px; }
.check { width: 18px; height: 18px; flex-shrink: 0; }

/* explorer */
.address { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-bottom: 2px solid var(--line); font-size: 14px; flex-shrink: 0; }
.address .field { flex: 1; padding: 8px 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.files { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; padding: 20px; background: var(--paper); }
.file {
  display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px 8px; border: 0; background: none; cursor: pointer; text-align: center;
}
.file svg { width: 56px; height: 56px; }
.file .name { font-size: 13px; padding: 1px 6px; }
.file .desc { font-family: var(--px); font-size: 16px; line-height: 1.25; }
.file:hover .name, .file:focus-visible .name { background: var(--pri); }
.statusbar { padding: 6px 10px; font-size: 13px; color: var(--muted); border-top: 2px solid var(--line); flex-shrink: 0; }

/* case */
.case { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 24px; padding: 24px; }
.gallery { display: flex; flex-direction: column; gap: 12px; }
.viewer { position: relative; aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; overflow: hidden; background: var(--desk); }
.viewer img { width: 100%; height: 100%; object-fit: contain; display: block; }
.win:focus { outline: none; }
.viewer .ph { padding: 24px 64px; }
.ph { padding: 24px; text-align: center; font-size: 14px; color: var(--muted); line-height: 1.5; }
.nav-btn {
  position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border: 0; padding: 0;
  background: var(--face); box-shadow: var(--bevel); cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.nav-btn:active { box-shadow: var(--sunk); }
.nav-btn.prev { left: 12px; } .nav-btn.next { right: 12px; }
.nav-btn svg { width: 18px; height: 18px; }
.counter { position: absolute; bottom: 10px; right: 10px; background: var(--face); padding: 2px 8px; font-size: 13px; box-shadow: var(--bevel); }
.caption { font-size: 14px; color: var(--muted); min-height: 1.5em; }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumb {
  width: 64px; height: 48px; border: 0; padding: 0; background: var(--desk); box-shadow: var(--bevel); cursor: pointer; overflow: hidden;
  font-size: 12px; color: var(--muted);
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb[aria-current="true"] { box-shadow: var(--sunk); outline: 2px solid var(--ink); outline-offset: -2px; }
.case-text { display: flex; flex-direction: column; gap: 18px; }
.case-text .tag { align-self: flex-start; font-family: var(--px); font-size: 18px; padding: 2px 10px; background: var(--ink); color: var(--face); }
.case-text h3 { margin: 0; font-family: var(--px); font-weight: 600; font-size: 34px; line-height: 1.12; }
.case-text p { margin: 0; font-size: 16px; line-height: 1.6; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 14px; }
fieldset { margin: 0; border: 2px solid var(--line); box-shadow: 1px 1px 0 var(--paper); padding: 10px 14px 14px; font-size: 14px; line-height: 1.55; min-width: 0; }
legend { padding: 0 8px; font-family: var(--px); font-size: 16px; background: var(--sec); }
.stat { display: flex; align-items: center; gap: 18px; padding: 16px; }
.stat b { font-family: var(--px); font-weight: 700; font-size: 64px; line-height: 1; }

/* about */
.about { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 20px; padding: 16px; }
.portrait { aspect-ratio: 4 / 5; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.portrait img { width: 100%; height: 100%; object-fit: cover; }
.note { padding: 26px; display: flex; flex-direction: column; gap: 16px; font-size: 16px; line-height: 1.7; }
.note .lead { font-family: var(--px); font-size: 28px; line-height: 1.25; margin: 0; }
.note p { margin: 0; }
.note mark { background: var(--sec); color: inherit; padding: 0 6px; }

/* dialogs */
.dialog { display: flex; gap: 24px; padding: 28px; align-items: flex-start; }
.dialog svg { width: 52px; height: 52px; flex-shrink: 0; }
.dialog .text { display: flex; flex-direction: column; gap: 20px; }
.dialog h3 { margin: 0; font-family: var(--px); font-weight: 400; font-size: 28px; line-height: 1.2; }
.dialog p { margin: 0; font-size: 15px; line-height: 1.6; }

/* ---------- taskbar & start ---------- */
.taskbar { height: var(--taskbar); flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 0 6px; background: var(--face); box-shadow: var(--bevel); position: relative; z-index: 9000; }
.start { min-height: 38px; padding: 0 14px; border: 0; background: var(--face); box-shadow: var(--bevel); font-family: var(--px); font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 8px; cursor: pointer; flex-shrink: 0; }
.start[aria-expanded="true"] { box-shadow: var(--sunk); }
.start i { width: 16px; height: 16px; background: var(--pri); box-shadow: 4px 4px 0 var(--sec); margin-right: 4px; }
.sep { width: 2px; height: 34px; background: var(--line); flex-shrink: 0; }
.tasks { display: flex; gap: 6px; flex: 1; min-width: 0; overflow: hidden; }
.task { min-height: 38px; width: 170px; min-width: 0; flex-shrink: 1; padding: 0 12px; border: 0; background: var(--face); box-shadow: var(--bevel); font-size: 13px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.task[aria-pressed="true"] { box-shadow: var(--sunk); background: var(--paper); }
.tray { min-height: 38px; padding: 0 14px; display: flex; align-items: center; font-size: 13px; flex-shrink: 0; }
.startmenu {
  position: absolute; left: 6px; bottom: calc(var(--taskbar) - 2px); z-index: 9500; display: flex; width: 290px;
  padding: 4px; background: var(--face); box-shadow: var(--bevel);
}
.startmenu[hidden] { display: none; }
.startmenu .stripe { width: 36px; background: var(--pri); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 12px; }
.startmenu .stripe span { writing-mode: vertical-rl; transform: rotate(180deg); font-family: var(--px); font-weight: 700; font-size: 20px; color: var(--bar-text); }
.startmenu ul { list-style: none; margin: 0; padding: 4px; flex: 1; }
.startmenu li button { width: 100%; min-height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border: 0; background: none; text-align: left; font-size: 15px; cursor: pointer; }
.startmenu li button:hover, .startmenu li button:focus-visible { background: var(--pri); }
.startmenu li button svg { width: 24px; height: 24px; flex-shrink: 0; }
.startmenu hr { border: 0; border-top: 2px solid var(--line); margin: 4px 0; }

/* ---------- mobile ---------- */
@media (max-width: 899px) {
  .menubar .os { display: none; }
  .menubar button { padding: 0 8px; }
  .icons { position: static; display: grid; grid-template-columns: repeat(3, 1fr); justify-items: center; gap: 12px; padding: 24px 12px; }
  .win { position: absolute; inset: 0 !important; width: auto !important; max-width: none; max-height: none; }
  .titlebar { cursor: default; }
  .controls .max-btn { display: none; }
  .case, .about { grid-template-columns: minmax(0, 1fr); padding: 16px; }
  .facts { grid-template-columns: minmax(0, 1fr); }
  .welcome { padding: 24px 20px; }
  .dialog { flex-direction: column; padding: 20px; }
  .task { width: 110px; padding: 0 8px; }
  .tray { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .win, .caret { animation: none; }
}
</style>
</head>
<body>
<div class="shell">
  <header class="menubar">
    <nav aria-label="Главное меню">
      <span class="logo" aria-hidden="true">А:\</span>
      <button type="button" data-open="cases">Кейсы</button>
      <button type="button" data-open="about">Обо мне</button>

    <span class="os">Анастасия OS, выпуск 2026</span>

  <main class="desktop" id="desktop">

    <nav class="icons" aria-label="Рабочий стол">
      <button class="icon" type="button" data-open="cases"><svg viewBox="0 0 48 48" fill="none" stroke="#2B2620" stroke-width="2" aria-hidden="true"><path d="M4 12h14l4 4h22v24H4z" style="fill: var(--sec)"/><path d="M4 18h40"/></svg><span>Кейсы</span></button>
      <button class="icon" type="button" data-open="about"><svg viewBox="0 0 48 48" fill="none" stroke="#2B2620" stroke-width="2" aria-hidden="true"><path d="M10 4h20l10 10v30H10z" fill="#FFFDF7"/><path d="M30 4v10h10M16 22h16M16 28h16M16 34h10"/></svg><span>Обо мне</span></button>
      <button class="icon" type="button" data-open="resume"><svg viewBox="0 0 48 48" fill="none" stroke="#2B2620" stroke-width="2" aria-hidden="true"><path d="M10 4h20l10 10v30H10z" fill="#FFFDF7"/><path d="M30 4v10h10"/><path d="M15 24h18v10H15z" style="fill: var(--pri)"/></svg><span>Резюме.pdf</span></button>
      <button class="icon" type="button" data-open="contacts"><svg viewBox="0 0 48 48" fill="none" stroke="#2B2620" stroke-width="2" aria-hidden="true"><path d="M4 12h40v26H4z" fill="#FFFDF7"/><path d="M4 12l20 16 20-16"/></svg><span>Контакты</span></button>
      <button class="icon" type="button" data-open="trash"><svg viewBox="0 0 48 48" fill="none" stroke="#2B2620" stroke-width="2" aria-hidden="true"><path d="M12 14h24l-3 28H15z" fill="#FFFDF7"/><path d="M8 14h32M18 8h12v6M20 20v16M28 20v16"/></svg><span>Корзина</span></button>

  </main>

  <div class="startmenu" id="startmenu" hidden>
    <div class="stripe" aria-hidden="true"><span>Анастасия OS</span></div>
    <ul>
      <li><button type="button" data-open="cases"><svg viewBox="0 0 48 48" fill="none" stroke="#2B2620" stroke-width="3" aria-hidden="true"><path d="M4 12h14l4 4h22v24H4z" style="fill: var(--sec)"/></svg>Кейсы</button></li>
      <li><button type="button" data-open="about"><svg viewBox="0 0 48 48" fill="none" stroke="#2B2620" stroke-width="3" aria-hidden="true"><path d="M10 4h20l10 10v30H10z" fill="#FFFDF7"/></svg>Обо мне</button></li>
      <li><button type="button" data-open="skills"><svg viewBox="0 0 48 48" fill="none" stroke="#2B2620" stroke-width="3" aria-hidden="true"><path d="M6 6h36v36H6z" fill="#FFFDF7"/><path d="M14 24l7 7 14-14"/></svg>Навыки</button></li>
      <li><button type="button" data-open="contacts"><svg viewBox="0 0 48 48" fill="none" stroke="#2B2620" stroke-width="3" aria-hidden="true"><path d="M4 12h40v26H4z" fill="#FFFDF7"/><path d="M4 12l20 16 20-16"/></svg>Связаться</button></li>
      <li><hr></li>
      <li><button type="button" id="theme-toggle"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="4" y="4" width="20" height="40" style="fill: var(--pri)"/><rect x="24" y="4" width="20" height="40" style="fill: var(--sec)"/></svg><span>Сменить цвет</span></button></li>
      <li><button type="button" id="close-all"><svg viewBox="0 0 48 48" fill="none" stroke="#2B2620" stroke-width="3" aria-hidden="true"><path d="M12 12l24 24M36 12L12 36"/></svg>Закрыть все окна</button></li>
    </ul>
  </div>

  <footer class="taskbar">
    <button class="start" type="button" id="start" aria-expanded="false" aria-controls="startmenu"><i aria-hidden="true"></i>Пуск</button>

    <div class="tray sunk" id="tray">RU</div>

<script>
/* =====================================================================

   ===================================================================== */

    },
    {
      id: 'escar', file: 'escar_telegram.doc', short: 'Telegram-канал Эскара',
      title: 'Канал, который сначала знакомит, а потом продаёт',
      lede: 'Запуск Telegram-канала для самого бренда-производителя: прогрев аудитории без агрессивных продаж и мост между выставкой и онлайном.',

/* ---------- window manager ---------- */
const wins = {};
let z = 10, cascade = 0;

function openWin(id) {
  closeStart();
  if (wins[id]) { wins[id].el.hidden = false; focusWin(id); return; }
  const t = TEMPLATES[id]; if (!t) return;
  const { title, w, body } = t();
  const el = document.createElement('section');
  el.className = 'win'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', title); el.tabIndex = -1;
  el.innerHTML = `
    <div class="titlebar"><h2>${esc(title)}</h2>
      <div class="controls">
        <button type="button" data-act="min" aria-label="Свернуть">${svgI('min')}</button>
        <button type="button" class="max-btn" data-act="max" aria-label="Развернуть">${svgI('max')}</button>
        <button type="button" data-act="close" aria-label="Закрыть">${svgI('close')}</button>
      </div></div>
    <div class="win-body">${body}</div>`;
  desktop.appendChild(el);
  // position
  if (!mobile()) {
    const dw = desktop.clientWidth, dh = desktop.clientHeight;
    const width = Math.min(w, dw - 160);
    el.style.width = width + 'px';
    const preset = { welcome: [150, 24], skills: [Math.max(150, dw - 400), 24] }[id];
    let x, y;
    if (preset) [x, y] = preset;
    else { x = Math.max(150, (dw - width) / 2 + cascade * 28); y = 24 + cascade * 28; cascade = (cascade + 1) % 6; }
    el.style.left = Math.min(x, Math.max(0, dw - width - 8)) + 'px';
    el.style.top = Math.min(y, Math.max(0, dh - 200)) + 'px';
    fitHeight(el);
  }
  const task = document.createElement('button');
  task.className = 'task'; task.type = 'button'; task.textContent = title;
  task.addEventListener('click', () => {
    const wobj = wins[id];
    if (wobj.el.hidden) { wobj.el.hidden = false; focusWin(id); }
    else if (wobj.el.classList.contains('active')) minimize(id);
    else focusWin(id);
  });
  tasks.appendChild(task);
  wins[id] = { el, task };
  el.addEventListener('pointerdown', () => focusWin(id));
  el.querySelector('.controls').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.act === 'min') minimize(id);
    if (b.dataset.act === 'max') el.classList.toggle('max');
    if (b.dataset.act === 'close') closeWin(id);
  });
  el.querySelector('.titlebar').addEventListener('dblclick', e => { if (!e.target.closest('button') && !mobile()) el.classList.toggle('max'); });
  el.addEventListener('click', e => {
    if (e.target.closest('[data-close]')) closeWin(id);
    if (e.target.closest('[data-close-after]')) setTimeout(() => closeWin(id), 200);
  });
  enableDrag(el);
  const g = el.querySelector('[data-gallery]'); if (g) initGallery(g);
  focusWin(id);
}
function focusWin(id) {
  Object.values(wins).forEach(w => { w.el.classList.remove('active'); w.task.setAttribute('aria-pressed', 'false'); });
  const w = wins[id]; if (!w) return;
  w.el.style.zIndex = ++z; w.el.classList.add('active'); w.task.setAttribute('aria-pressed', 'true');
  if (!w.el.contains(document.activeElement)) w.el.focus({ preventScroll: true });
}
function minimize(id) {
  const w = wins[id]; w.el.hidden = true; w.el.classList.remove('active'); w.task.setAttribute('aria-pressed', 'false');
  focusTop();
}
function closeWin(id) {
  const w = wins[id]; if (!w) return;
  w.el.remove(); w.task.remove(); delete wins[id]; focusTop();
}
function focusTop() {
  const vis = Object.entries(wins).filter(([, w]) => !w.el.hidden).sort((a, b) => b[1].el.style.zIndex - a[1].el.style.zIndex);
  if (vis[0]) focusWin(vis[0][0]);
}
function fitHeight(el) { if (!mobile()) el.style.maxHeight = Math.max(200, desktop.clientHeight - el.offsetTop - 8) + 'px'; }
function enableDrag(el) {
  const bar = el.querySelector('.titlebar');
  let sx, sy, ox, oy, dragging = false;
  bar.addEventListener('pointerdown', e => {
    if (mobile() || e.target.closest('button') || el.classList.contains('max') || e.button !== 0) return;
    dragging = true; sx = e.clientX; sy = e.clientY; ox = el.offsetLeft; oy = el.offsetTop;
    bar.setPointerCapture(e.pointerId); bar.style.cursor = 'grabbing';
  });
  bar.addEventListener('pointermove', e => {
    if (!dragging) return;
    const maxX = desktop.clientWidth - 80, maxY = desktop.clientHeight - 40;
    el.style.left = Math.min(maxX, Math.max(-el.offsetWidth + 80, ox + e.clientX - sx)) + 'px';
    el.style.top = Math.min(maxY, Math.max(0, oy + e.clientY - sy)) + 'px';
    fitHeight(el);
  });
  const stop = () => { dragging = false; bar.style.cursor = ''; };
  bar.addEventListener('pointerup', stop); bar.addEventListener('pointercancel', stop);
}

/* ---------- gallery ---------- */
function initGallery(root) {
  const c = PORTFOLIO.cases.find(x => x.id === root.dataset.gallery);
  const slot = root.querySelector('.slot'), counter = root.querySelector('.counter'), cap = root.querySelector('.caption');
  const thumbs = [...root.querySelectorAll('.thumb')];
  let i = 0;
  const show = n => {
    i = (n + c.images.length) % c.images.length;
    const img = c.images[i];
    slot.style.cssText = 'width:100%;height:100%;display:flex;align-items:center;justify-content:center';
    slot.innerHTML = media(img, img.caption);
    counter.textContent = `${i + 1} / ${c.images.length}`;
    cap.textContent = img.caption || '';
    thumbs.forEach((t, k) => t.setAttribute('aria-current', k === i ? 'true' : 'false'));
  };
  root.querySelector('.prev')?.addEventListener('click', () => show(i - 1));
  root.querySelector('.next')?.addEventListener('click', () => show(i + 1));
  thumbs.forEach(t => t.addEventListener('click', () => show(+t.dataset.i)));
  root.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') { show(i - 1); e.preventDefault(); }
    if (e.key === 'ArrowRight') { show(i + 1); e.preventDefault(); }
  });
  // swipe on touch
  let tx = null;
  const viewer = root.querySelector('.viewer');
  viewer.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
  viewer.addEventListener('touchend', e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 40) show(i + (dx < 0 ? 1 : -1)); tx = null; });
  show(0);
}

/* ---------- start menu, theme, global ---------- */
const startBtn = $('#start'), startMenu = $('#startmenu');
function closeStart() { startMenu.hidden = true; startBtn.setAttribute('aria-expanded', 'false'); }
startBtn.addEventListener('click', e => {
  e.stopPropagation();
  const open = startMenu.hidden; startMenu.hidden = !open; startBtn.setAttribute('aria-expanded', String(open));
  if (open) startMenu.querySelector('button').focus();
});
document.addEventListener('click', e => {
  const o = e.target.closest('[data-open]'); if (o) { e.preventDefault(); openWin(o.dataset.open); return; }
  if (!e.target.closest('#startmenu')) closeStart();
});
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('theme', t); } catch (e) {}
}
try { const saved = localStorage.getItem('theme'); if (saved) document.documentElement.dataset.theme = saved; } catch (e) {}
$('#theme-toggle').addEventListener('click', () => { setTheme(document.documentElement.dataset.theme === 'pink' ? 'blue' : 'pink'); closeStart(); });
$('#close-all').addEventListener('click', () => { Object.keys(wins).forEach(closeWin); closeStart(); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!startMenu.hidden) { closeStart(); startBtn.focus(); return; }
  const top = Object.entries(wins).find(([, w]) => w.el.classList.contains('active'));
  if (top) closeWin(top[0]);
});

window.addEventListener('resize', () => Object.values(wins).forEach(w => mobile() ? w.el.style.maxHeight = '' : fitHeight(w.el)));

/* tray clock */
const tray = $('#tray');
const tick = () => { tray.textContent = 'RU  ' + new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }); };
tick(); setInterval(tick, 30000);

/* start state */
openWin('welcome');
if (!mobile()) openWin('skills'), focusWin('welcome');
</script>
